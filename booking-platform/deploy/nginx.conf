# Replace the example hostname/certificate paths with the actual TLS domain.
limit_req_zone $binary_remote_addr zone=maxtravel_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=maxtravel_api:10m rate=240r/m;
log_format maxtravel_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
  listen 443 ssl;
  server_tokens off;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name booking.example.com;
  ssl_certificate /etc/letsencrypt/live/booking.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/booking.example.com/privkey.pem;
  client_max_body_size 1m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  access_log /var/log/nginx/maxtravel-access.log maxtravel_safe;
  location /api/auth/ {
    # Standard upstream error logs can include verification-token query strings.
    error_log /dev/null;
    limit_req zone=maxtravel_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3108;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location = /api/webhooks/razorpay {
    proxy_pass http://127.0.0.1:3108;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/ {
    limit_req zone=maxtravel_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3108;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location / {
    # Health/worker diagnostics replace raw upstream URL logging.
    error_log /dev/null;
    proxy_pass http://127.0.0.1:3108;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
  }
}
server {
  listen 80;
  server_name booking.example.com;
  return 301 https://$host$request_uri;
}
