name: WebKit fixture smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: booking-platform
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SEO_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: booking-platform/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: Verify Linux WebKit desktop and iPhone-emulated fixture journeys
        run: npx playwright test --config=playwright.webkit.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-fixture-evidence
          path: |
            booking-platform/playwright-report-webkit/
            booking-platform/test-results-webkit/
          if-no-files-found: warn
