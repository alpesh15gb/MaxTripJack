name: Booking platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-platform
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maxtravel_ci
          POSTGRES_USER: maxtravel
          POSTGRES_PASSWORD: ephemeral-ci-database-only
        ports: ['55439:5432']
        options: --health-cmd "pg_isready -U maxtravel -d maxtravel_ci" --health-interval 5s --health-timeout 5s --health-retries 20
      mail:
        image: axllent/mailpit:latest
        ports: ['11025:1025', '18025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking-platform/package-lock.json
      - run: npm ci
      - name: Generate isolated fixture configuration
        run: |
          node --input-type=module <<'JS'
          import {randomBytes} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const value=`DATABASE_URL=postgresql://maxtravel:ephemeral-ci-database-only@127.0.0.1:55439/maxtravel_ci\nBETTER_AUTH_URL=http://127.0.0.1:3000\nBETTER_AUTH_SECRET=${randomBytes(32).toString('hex')}\nTRAVELLER_ENCRYPTION_KEY=${randomBytes(32).toString('hex')}\nSMTP_HOST=127.0.0.1\nSMTP_PORT=11025\nSMTP_SECURE=false\nMAIL_FROM=Max Travel <ci@example.test>\n`;
          writeFileSync('.env.local',value,{mode:0o600});
          JS
      - run: npm run db:migrate && npm run db:auth
      - name: Verify anonymous shopping ownership on disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://maxtravel:ephemeral-ci-database-only@127.0.0.1:55439/payglocal_disposable
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client = new pg.Client({connectionString:'postgresql://maxtravel:ephemeral-ci-database-only@127.0.0.1:55439/postgres'});
          try { await client.connect(); await client.query('CREATE DATABASE payglocal_disposable'); }
          finally { await client.end(); }
          JS
          node --import tsx tests/guest-shopping-postgres.mts
          node --conditions=react-server --import ./scripts/standalone-server.mjs --import tsx tests/guest-shopping-routes.mts
          node --import tsx tests/booking-report-postgres.mts
      - run: npm run lint && npm test && npm run test:refunds && npm run test:cancellations && npm run build && npm run build:workers
      - name: Start fixture server and check flows
        run: |
          npm run start > /tmp/booking-ci.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 2; done
          npm run test:integration
          # Keep real authentication limits enabled between independent fixture identities.
          sleep 60
          npm run test:providers
          sleep 60
          npm run test:checkout
          sleep 60
          npm run test:crm-commands
          sleep 60
          npm run test:flight-services
      - run: npm audit --omit=dev --audit-level=high
  browser-ui:
    name: Booking UI · synthetic providers · desktop and mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-platform
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking-platform/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify public SEO and private crawl boundaries in real HTML
        run: npm run test:seo:http
      - name: Exercise real production UI with intercepted supplier and payment fixtures
        run: npm run test:browser
      - name: Verify PayGlocal unavailable checkout on desktop and mobile
        run: npx playwright test -c playwright.payglocal.config.ts
      - name: Preserve UI screenshots, failure traces and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-ui-synthetic-provider-evidence
          path: |
            booking-platform/playwright-report/
            booking-platform/test-results/
            booking-platform/playwright-report-payglocal/
            booking-platform/test-results-payglocal/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve lightweight visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-ui-screenshots-and-errors
          path: |
            booking-platform/test-results/**/*.png
            booking-platform/test-results/**/error-context.md
            booking-platform/test-results-payglocal/**/*.png
            booking-platform/test-results-payglocal/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
